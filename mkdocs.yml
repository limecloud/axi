site_name: AXI
site_description: Agent eXperience Interface：规范、开发指南与实践
site_url: !ENV [AXI_SITE_URL, ""]
docs_dir: content
site_dir: site
use_directory_urls: true
hooks:
  - scripts/agent-index.py
theme:
  name: material
  language: zh
  font: false
  palette:
    scheme: default
    primary: white
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: [zh, en]
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: axi-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - assets/mermaid.min.js
  - assets/diagrams.js
extra_css:
  - assets/site.css
nav:
  - 入门:
      - 概览: index.md
      - 快速上手: start/quickstart.md
      - 架构: architecture.md
      - 术语: start/glossary.md
  - 生态与集成:
      - 协作模型: ecosystem/index.md
      - 兼容性矩阵: ecosystem/compatibility.md
      - Skills 方法层: ecosystem/skills.md
      - 插件与分发: ecosystem/plugins.md
      - MCP Apps: ecosystem/mcp-apps.md
      - Codex:
          - 开放接口概览: ecosystem/codex/index.md
          - 插件、Skills 与连接: ecosystem/codex/plugins.md
          - WebMCP 页面工具: ecosystem/codex/webmcp.md
          - Browser Annotation API: ecosystem/codex/annotations.md
          - 原生界面、文件与会话: ecosystem/codex/interfaces.md
          - CLI、SDK 与运行时: ecosystem/codex/runtime.md
          - 接入验证: ecosystem/codex/verification.md
      - Claude Code:
          - 接入与调研: ecosystem/claude-code/index.md
      - WorkBuddy:
          - 接入与调研: ecosystem/workbuddy/index.md
      - DSH:
          - 原生能力与浏览器桥接: ecosystem/dsh/index.md
      - 新载体适配: ecosystem/adapters.md
  - 生命周期:
      - 全流程: lifecycle/index.md
      - 发现、安装与启用: lifecycle/install.md
      - 连接、鉴权与授权: lifecycle/auth.md
      - 发现、执行与核验: lifecycle/use.md
      - 迭代、升级与迁移: lifecycle/update.md
      - 测试、发布与回读: lifecycle/release.md
      - 撤销、卸载与退役: lifecycle/retire.md
  - 规范:
      - 当前草案: specification/index.md
      - 0.2.1:
          - 范围与规范用语: specification/0.2.1/index.md
          - 数据模型: specification/0.2.1/model.md
          - 能力发现: specification/0.2.1/discovery.md
          - 上下文与定位: specification/0.2.1/context.md
          - 执行与授权: specification/0.2.1/execution.md
          - 结果与状态: specification/0.2.1/results.md
          - 错误: specification/0.2.1/errors.md
          - 恢复与幂等: specification/0.2.1/recovery.md
          - 分页与输出: specification/0.2.1/pagination.md
          - 批量读取: specification/0.2.1/batch.md
          - 等待与取消: specification/0.2.1/wait.md
          - 版本与扩展: specification/0.2.1/versioning.md
          - 安全: specification/0.2.1/security.md
          - 集成生命周期: specification/0.2.1/lifecycle.md
  - 开发:
      - 提供方指南: develop/provider.md
      - 客户端指南: develop/client.md
      - CLI 绑定: develop/cli.md
      - MCP 绑定: develop/mcp.md
      - 浏览器与页面工具: browser.md
      - Skills 与交付: discovery.md
  - 实践:
      - 本地工作区与云端协作: practices/local-workspaces.md
      - 减少回合与延迟: practices/performance.md
      - 超时与恢复演练: practices/recovery.md
      - 无浏览器与人工接管: practices/handoff.md
      - 排障: practices/troubleshooting.md
  - 参考:
      - 合同导读: contracts.md
      - Schema: reference/schema.md
      - 示例: examples.md
      - 验证与符合性: verification.md
      - 采用清单: reference/adoption.md
      - 贡献与演进: community/contributing.md
      - 变更记录: community/changelog.md
      - 来源与设计取舍: references.md
extra:
  generator: false
